services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_NAME: ${MODEL_NAME:-ProsusAI/finbert}
      DATABASE_URL: postgresql+psycopg://sentiment:sentiment@db:5432/sentiment
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-5000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model-cache:/root/.cache/huggingface

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentiment
      POSTGRES_USER: sentiment
      POSTGRES_PASSWORD: sentiment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment -d sentiment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  model-cache:
